name: Build installer

# Build hoàn toàn TỰ ĐỘNG, không phụ thuộc máy cục bộ nào - chạy từ bản clone sạch của repo trên máy ảo
# GitHub, ra đủ 4 file phát hành mà người dùng tải về: OneForAll_Setup.exe (Inno Setup), OneForAll_Setup.msi
# (WiX Toolset - lối thoát cho máy chặn .exe tự giải nén, xem PROJECT_OVERVIEW.md mục 4n), và zip của cả
# hai. Đây là điều kiện BẮT BUỘC của SignPath Foundation (chứng chỉ ký số EV miễn phí cho dự án mã nguồn
# mở) - "quy trình build phải tự động hoàn toàn và tích hợp sẵn, đảm bảo file nhị phân sinh ra TRỰC TIẾP từ
# mã nguồn đã commit vào repo" - xem PROJECT_OVERVIEW.md mục 4m.
#
# Chạy khi: đẩy tag "vX.Y.Z" (bản phát hành thật - tự tạo GitHub Release kèm file cài đặt), đẩy lên
# nhánh main (chỉ để xác nhận build không vỡ, không tạo Release), hoặc tự bấm chạy tay (workflow_dispatch).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # cần để tự tạo GitHub Release + đính kèm file khi đẩy tag

# Hủy lượt chạy CŨ hơn đang dở dang của CÙNG nhánh/tag khi có lượt chạy MỚI (vd đẩy nhiều commit sửa lỗi
# liên tiếp trong lúc đang debug pipeline) - tránh tốn phút chạy CI vô ích cho kết quả sắp lỗi thời.
# KHÔNG áp dụng cho tag (mỗi tag là một bản phát hành riêng biệt, không được hủy ngang).
concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # 6.10.3 thay vì 6.11.1 (bản Qt thật đang dùng để dev cục bộ, xem build_app.bat) - đã xác nhận THẬT qua
  # `aqt list-qt windows desktop --arch 6.11.1`: toàn bộ nhánh 6.11.x (cả 6.11.0 lẫn 6.11.1) hiện CHƯA có
  # dữ liệu kiến trúc (Updates.xml) trên mạng lưới mirror mà aqtinstall (công cụ cài Qt dùng trong CI) có
  # thể truy cập - bản quá mới, chưa kịp đồng bộ, không phải lỗi cấu hình. 6.10.3 vẫn dùng ĐÚNG cùng bộ
  # công cụ MinGW 13.1.0 như máy dev cục bộ (xác nhận qua `aqt list-qt --long-modules 6.10.3 win64_mingw`)
  # nên nhị phân sinh ra tương đương - không ảnh hưởng gì tới tính năng ứng dụng. Có thể nâng lên 6.11.1
  # sau khi mirror đồng bộ xong (thử lại `aqt list-qt windows desktop --arch 6.11.1` định kỳ).
  QT_VERSION: "6.10.3"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài Qt (MinGW 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: "win64_mingw"
          tools: "tools_mingw1310,qt.tools.win64_mingw1310"
          # Qt6Multimedia là module RIÊNG (không nằm trong gói Qt6 cơ bản) - CMakeLists.txt dòng 24
          # (find_package(Qt6 REQUIRED COMPONENTS ... Multimedia Svg ...)) cần nó - thiếu dòng này khiến
          # cấu hình CMake thất bại ngay (xác nhận THẬT qua log chạy lần đầu: "Could NOT find
          # Qt6Multimedia"). Qt6Svg KHÔNG phải module riêng ở bản Qt này (xác nhận qua
          # `aqt list-qt --modules 6.10.3 win64_mingw` - không có "qtsvg" trong danh sách) - đã nằm sẵn
          # trong gói cơ bản, thêm "qtsvg" vào đây gây lỗi "packages ['qtsvg'] were not found".
          modules: "qtmultimedia"
          cache: true

      - name: Cài Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Cài Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Cài WiX Toolset v3 (cho bo cai dat .msi)
        run: choco install wixtoolset -y --no-progress

      - name: Tim duong dan WiX Toolset (ten thu muc choco cai phu thuoc version, khong co dinh)
        id: wix
        shell: pwsh
        run: |
          $candle = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candle) { throw "Khong tim thay WiX Toolset sau khi cai qua choco" }
          $wixBin = Split-Path $candle.FullName -Parent
          Write-Host "WiX bin: $wixBin"
          "WIXBIN=$wixBin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Tải + xác minh adb/scrcpy, yt-dlp, ffmpeg (vendor/ không commit vào Git - xem .gitignore/THIRD_PARTY.md)
        shell: pwsh
        run: ./scripts/ci_fetch_vendor.ps1

      - name: Cấu hình CMake
        shell: pwsh
        run: cmake -B build -G Ninja -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DCMAKE_BUILD_TYPE=Release

      - name: Biên dịch
        run: cmake --build build

      - name: Đóng gói Qt DLLs (windeployqt)
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" "build\OneForAll.exe" --no-translations --compiler-runtime

      - name: Dựng OneForAll_Release (đúng mẫu build_app.bat bước [4/6]-[6/6])
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "OneForAll_Release" | Out-Null
          Copy-Item "build\OneForAll.exe" "OneForAll_Release\" -Force
          Get-ChildItem "build\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "OneForAll_Release\" -Force
          New-Item -ItemType Directory -Force -Path "OneForAll_Release\scrcpy" | Out-Null
          Copy-Item "vendor\scrcpy\*" "OneForAll_Release\scrcpy\" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "OneForAll_Release\yt-dlp" | Out-Null
          Copy-Item "vendor\yt-dlp\*" "OneForAll_Release\yt-dlp\" -Recurse -Force
          foreach ($d in @("generic","iconengines","imageformats","multimedia","networkinformation","platforms","styles","tls")) {
              if (Test-Path "build\$d") {
                  New-Item -ItemType Directory -Force -Path "OneForAll_Release\$d" | Out-Null
                  Copy-Item "build\$d\*" "OneForAll_Release\$d\" -Recurse -Force
              }
          }
          # Chuoi Auto Click MAU - nguon duy nhat la profiles\default.json trong Git (build_app.bat buoc [7/7]).
          New-Item -ItemType Directory -Force -Path "OneForAll_Release\profiles" | Out-Null
          Copy-Item "profiles\default.json" "OneForAll_Release\profiles\default.json" -Force

      - name: Biên dịch trình cài đặt .exe (Inno Setup, đúng mẫu build_installer.bat)
        shell: pwsh
        run: |
          $ISCC = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $appver = (Get-Content "VERSION" -Raw).Trim()
          Write-Host "Phien ban: $appver"
          & $ISCC "/DMyAppVersion=$appver" "installer\OneForAll.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC that bai (ma $LASTEXITCODE)" }

      # Tu day tro di: dung bo cai dat .msi (WiX Toolset) - xem PROJECT_OVERVIEW.md muc 4n. Mot so may
      # Windows 11 (Smart App Control) chan file .exe tu giai nen - .msi di qua msiexec.exe co san cua he
      # dieu hanh la loi thoat thay the. Dung CHINH XAC cung chuoi lenh da xac nhan that tren may dev cuc
      # bo (heat -gg -scom -sreg -sfrag -srd, candle/light + -sice:ICE38/ICE64/ICE91 - xem build_installer.bat).
      - name: Don sach ban sao OneForAll_Release cho heat.exe (loai logs + profiles, chi giu default.json mau)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "obj\msi_stage\OneForAll_Release" | Out-Null
          New-Item -ItemType Directory -Force -Path "obj\msi_obj" | Out-Null
          robocopy "OneForAll_Release" "obj\msi_stage\OneForAll_Release" /E /XD logs profiles /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { throw "robocopy loi that su (ma $LASTEXITCODE)" }
          # BAT BUOC dat lai: robocopy tra ma 1 khi COPY THANH CONG, va buoc "shell: pwsh" cua GitHub Actions
          # ket thuc bang "exit $LASTEXITCODE" cua lenh native cuoi cung - khong dat lai thi ca buoc bi tinh
          # la THAT BAI du khong co loi nao.
          $global:LASTEXITCODE = 0
          New-Item -ItemType Directory -Force -Path "obj\msi_stage\OneForAll_Release\profiles" | Out-Null
          Copy-Item "profiles\default.json" "obj\msi_stage\OneForAll_Release\profiles\default.json" -Force

      - name: Bien dich bo cai dat .msi (WiX: heat + candle + light)
        shell: pwsh
        run: |
          $appver = (Get-Content "VERSION" -Raw).Trim()
          $stage = "$PWD\obj\msi_stage\OneForAll_Release"
          $objDir = "$PWD\obj\msi_obj"
          & "$env:WIXBIN\heat.exe" dir "$stage" -cg MainComponents -gg -scom -sreg -sfrag -srd -dr INSTALLFOLDER -var var.StagingDir -out "$objDir\Harvested.wxs"
          if ($LASTEXITCODE -ne 0) { throw "heat.exe that bai (ma $LASTEXITCODE)" }
          # -out "...\\" (hai dau \ truoc dau ngoac kep): bat buoc, mot dau \ don bi Windows hieu la ky tu
          # thoat lam hong dau ngoac dong (da xac nhan that tren may dev cuc bo - xem build_installer.bat).
          & "$env:WIXBIN\candle.exe" "-dAppVersion=$appver" "-dStagingDir=$stage" -out "$objDir\\" "installer\Product.wxs" "$objDir\Harvested.wxs"
          if ($LASTEXITCODE -ne 0) { throw "candle.exe that bai (ma $LASTEXITCODE)" }
          # -sice:ICE38/ICE64/ICE91: canh bao chi ap dung cho goi co the doi per-user/per-machine qua
          # ALLUSERS - du an nay luon per-user co dinh nen khong ap dung that (da xac nhan qua cai dat/go
          # cai dat thu nghiem that tren may dev).
          & "$env:WIXBIN\light.exe" -ext WixUIExtension -ext WixUtilExtension -b "installer" -sice:ICE38 -sice:ICE64 -sice:ICE91 -spdb -out "dist\OneForAll_Setup.msi" "$objDir\Product.wixobj" "$objDir\Harvested.wixobj"
          if ($LASTEXITCODE -ne 0) { throw "light.exe that bai (ma $LASTEXITCODE)" }

      - name: Nen zip ca hai bo cai dat (.exe + .msi)
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\OneForAll_Setup.exe" -DestinationPath "dist\OneForAll_Setup_exe.zip" -Force
          Compress-Archive -Path "dist\OneForAll_Setup.msi" -DestinationPath "dist\OneForAll_Setup_msi.zip" -Force

      - name: Tải lên artifact (xem lại được ở mọi lần chạy, kể cả không phải tag)
        uses: actions/upload-artifact@v4
        with:
          name: OneForAll_Release_Files
          path: |
            dist/OneForAll_Setup.exe
            dist/OneForAll_Setup.msi
            dist/OneForAll_Setup_exe.zip
            dist/OneForAll_Setup_msi.zip
          retention-days: 90

      - name: Tạo GitHub Release (chỉ khi đẩy tag "vX.Y.Z")
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OneForAll_Setup.exe
            dist/OneForAll_Setup.msi
            dist/OneForAll_Setup_exe.zip
            dist/OneForAll_Setup_msi.zip
          generate_release_notes: true
